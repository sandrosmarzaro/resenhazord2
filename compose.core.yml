# Core node (VM-B): the bot, on its own. It connects to the broker on the edge node via
# RABBITMQ_URL (amqps://<edge_private_ip> in production). No depends_on the gateway —
# broker durability replaces boot ordering, so the bot deploys and restarts on its own.
services:
  bot:
    container_name: bot
    image: ghcr.io/sandrosmarzaro/resenhazord2:python
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    # Ship telemetry to the local Alloy collector instead of straight to Grafana
    # Cloud (hybrid egress): Alloy holds the credential and derives RED + host
    # metrics. Overrides the direct endpoint in .env.
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
    # Apply pending migrations before serving, then hand PID 1 to uvicorn.
    command: sh -c "alembic upgrade head && exec uvicorn bot.main:app --host 0.0.0.0 --port 8000"
    # yt-dlp cookies for login-gated sources (Instagram). Place the Netscape-format
    # file at ./secrets/cookies.txt and set YTDLP_COOKIES=/secrets/cookies.txt in .env.
    # rw lets yt-dlp persist rotated session cookies, extending login validity.
    volumes:
      - ./secrets:/secrets
    networks:
      - resenha-network
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Core-node OTel collector (hybrid egress): receives OTLP from the bot, derives
  # RED from the command.handle spans (spanmetrics), scrapes host RAM/CPU/swap, and
  # is the single egress to Grafana Cloud — holding the one credential. ~55 MB idle.
  # The edge gateway stays OTLP-direct (no memory headroom for a collector there).
  alloy:
    container_name: alloy
    image: grafana/alloy:v1.19.2
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      - GRAFANA_CLOUD_OTLP_ENDPOINT=${GRAFANA_CLOUD_OTLP_ENDPOINT}
      - GRAFANA_CLOUD_OTLP_AUTH=${GRAFANA_CLOUD_OTLP_AUTH}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Host filesystem, read-only, for node_exporter (RAM/CPU/swap).
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # UI/metrics bound to localhost only, like the RabbitMQ management port.
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - resenha-network
    restart: unless-stopped
    mem_limit: 150m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  resenha-network:
    driver: bridge
