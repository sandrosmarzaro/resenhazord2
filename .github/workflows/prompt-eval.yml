name: Prompt eval

# Homologation gate for the decoupled system prompt. Runs the held-out regression
# eval against real LLM providers when the prompt seed or the eval changes, and
# on demand before promoting a hub commit to `prod`. Green here is the signal to
# run `uv run task prompt:promote`. It also measures retrieval recall@k against
# the Upstash index and pushes it to Grafana; the weekly run keeps that series
# alive between prompt changes.
on:
  pull_request:
    paths:
      - bot/data/agent_examples.py
      - bot/application/example_selector.py
      - tests/eval/**
      - scripts/push_prompt.py
      - scripts/promote_prompt.py
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      prompt_tag:
        description: Prompt alias to evaluate (dev or a commit hash)
        default: dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Prompt regression eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen
      - run: uv run task prompt:eval
        env:
          # Provider keys from repo secrets. With none set the eval self-skips, so
          # the gate stays green until a provider is configured. The built-in
          # Actions GITHUB_TOKEN does not authenticate GitHub Models, so a PAT with
          # models access must be supplied as GH_MODELS_TOKEN to use that provider.
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Present key evaluates the hub prompt at this alias; absent key evaluates
          # the in-code SYSTEM_PROMPT_TEMPLATE.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROMPT_TAG: ${{ github.event.inputs.prompt_tag || 'dev' }}
          # Absent Upstash keys skip the recall eval; absent OTLP keys keep its
          # result out of Grafana.
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
