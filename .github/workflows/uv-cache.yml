name: Warm uv cache

# PR and release jobs only restore the uv cache (save-cache: false), so nothing races
# to save it. This job is the one writer. PRs can read caches from the default branch,
# and 3.15 has no wheels for lupa and zstandard, so a cold sync rebuilds them in ~3m.
on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  warm:
    name: Warm uv cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - run: uv sync --frozen
