name: Pipeline

on:
  push:
    branches:
      - main

jobs:
  # The release PR into main already passed every gate (lint, tests, mutation, Sonar),
  # so main only deploys. Badges refresh from develop in badges.yml.
  build:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push TS bot
        uses: docker/build-push-action@v7
        with:
          context: ./gateway
          file: gateway/Dockerfile
          push: true
          tags: ghcr.io/sandrosmarzaro/resenhazord2:latest
          cache-from: type=gha,scope=ts
          cache-to: type=gha,mode=max,scope=ts

      - name: Build and push Python core
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/sandrosmarzaro/resenhazord2:python
          cache-from: type=gha,scope=py
          cache-to: type=gha,mode=max,scope=py

  # Deploy — two explicit jobs, one per node (ADR 0006). They run in parallel;
  # queue-contract changes follow expand/contract discipline so deploy order never matters.
  deploy-edge:
    name: SSH deploy to edge node (gateway + broker)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_EDGE_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.VPS_EDGE_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            "cd $VPS_APP_DIR && git pull && docker compose -f compose.edge.yml pull && docker compose -f compose.edge.yml up -d --no-build && docker image prune -af"

      # Queue limits are broker policies, applied after every deploy (idempotent).
      - name: Apply broker policies
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "cd $VPS_APP_DIR && docker compose -f compose.edge.yml exec -T rabbitmq sh -s < observability/rabbitmq/policies.sh"

  deploy-core:
    name: SSH deploy to core node (bot)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_CORE_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.VPS_CORE_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # Alloy is recreated on every deploy: git pull swaps config.alloy for a new
      # inode, and the single-file bind mount keeps showing the old one until then.
      - name: Deploy
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 \
            "$VPS_USER@$VPS_HOST" \
            "cd $VPS_APP_DIR && git pull && docker compose -f compose.core.yml pull && docker compose -f compose.core.yml up -d --no-build && docker compose -f compose.core.yml up -d --no-build --no-deps --force-recreate alloy && docker image prune -af"

  # Register deployment (after deploy)
  register-deploy:
    name: Register GitHub deployment
    runs-on: ubuntu-latest
    needs: [deploy-edge, deploy-core]
    permissions:
      deployments: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'main',
              environment: 'production',
              description: 'Deploy to Oracle VPS',
              auto_merge: false,
              required_contexts: []
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment: 'production',
              description: 'Deployment completed successfully'
            });

  # Tag release (after deploy)
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [deploy-edge, deploy-core]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create and push tag
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "v${VERSION}"; then
            echo "Tag v${VERSION} already exists, skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping"
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --latest
          fi

  # Back-merge main into develop
  back-merge:
    name: Back-merge main into develop
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main, nothing to back-merge"
            exit 0
          fi
          git merge --no-ff origin/main -m "chore: back-merge main into develop"
          git push origin develop
