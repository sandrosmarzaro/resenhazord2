name: External contracts

# Runs every command against its real upstream each night, so a broken third-party
# API shows up here before a user reports it. It is not a PR gate, because an
# upstream outage must not block merges. A call that fails two nights in a row, or
# fails once inside yt-dlp, gets its own issue labelled external-api. The GitHub-hosted runner is a datacenter IP
# like the OCI nodes, so IP-based blocks show up here as they do in prod.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  contracts:
    name: External API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen
      # The prod image ships ffmpeg and the runner does not. ,porno and ,fuck remux
      # every RedGifs video through it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      # The core node's login cookies, so ,dl reaches X and Instagram as in prod.
      - run: printf '%s\n' "$COOKIES" > "$RUNNER_TEMP/cookies.txt"
        env:
          COOKIES: ${{ secrets.YTDLP_COOKIES_TXT }}
      # The failures run once more, so a single upstream blip files no issue.
      - run: |
          uv run task test:external tests/integration/external --junitxml=contracts.xml \
            || uv run task test:external tests/integration/external --lf --junitxml=contracts.xml
        env:
          # Calls that need an absent key skip.
          BNET_ID: ${{ secrets.BNET_ID }}
          BNET_SECRET: ${{ secrets.BNET_SECRET }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          OFF_SESSION: ${{ secrets.OFF_SESSION }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          RESTCOUNTRIES_API_KEY: ${{ secrets.RESTCOUNTRIES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YTDLP_COOKIES: ${{ runner.temp }}/cookies.txt
      # A call that also failed the night before gets an issue of its own, and further
      # failures comment on that one.
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open_issue() {
            TITLE="$1" gh issue list --label external-api --state open --json number,title \
              --jq '.[] | select(.title == env.TITLE) | .number'
          }
          today=$(date -u +%F)
          # One failed call per line. pytest escapes non-ASCII ids (,b\xedblia) and
          # unicode_escape restores them. A yt-dlp failure (bot check, stale yt-dlp, a
          # site change) is never a one-night blip, so its call and the ERROR line also
          # go to ytdlp.txt and get an issue on the first night.
          python3 - > failures.txt <<'EOF'
          import xml.etree.ElementTree as ElementTree
          with open('ytdlp.txt', 'w') as ytdlp:
              for case in ElementTree.parse('contracts.xml').iter('testcase'):
                  outcome = case.find('failure')
                  if outcome is None:
                      outcome = case.find('error')
                  if outcome is None:
                      continue
                  call = case.get('name').partition('[')[2].rstrip(']')
                  call = call.encode().decode('unicode_escape')
                  print(call)
                  text = outcome.text or ''
                  errors = ['ERROR: ' + line.partition('ERROR: ')[2] for line in text.splitlines() if 'ERROR: [' in line]
                  if 'yt-dlp failed' in text:
                      ytdlp.write(f'{call}\t{errors[-1][:300] if errors else "yt-dlp failed"}\n')
          EOF
          mapfile -t failed < failures.txt

          read -r previous_run previous_date < <(gh run list --workflow external-contracts.yml \
            --event schedule --status completed --limit 1 --json databaseId,createdAt \
            --jq '.[0] | "\(.databaseId) \(.createdAt[:10])"') || true
          # A passing night uploads no list, nor did one from before this step existed.
          previous=''
          if [ -n "$previous_run" ] && gh run download "$previous_run" -n failures -D previous; then
            previous=$(cat previous/failures.txt)
          fi

          for call in "${failed[@]}"; do
            title="\`$call\` fails its external contract"
            issue=$(open_issue "$title")
            ytdlp_error=$(awk -F'\t' -v call="$call" '$1 == call { print $2 }' ytdlp.txt)
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Failed again on $today: $RUN_URL"
            elif [ -n "$ytdlp_error" ]; then
              body=$(printf "%s failed in yt-dlp on %s: %s\n\n\`\`\`\n%s\n\`\`\`" \
                "\`$call\`" "$today" "$RUN_URL" "$ytdlp_error")
              gh issue create --title "$title" --label external-api --label bug --body "$body"
            elif grep -qxF -- "$call" <<<"$previous"; then
              previous_url="${RUN_URL%/*}/$previous_run"
              body=$(printf "%s failed its external contract two nights in a row.\n\n- %s: %s\n- %s: %s" \
                "\`$call\`" "$previous_date" "$previous_url" "$today" "$RUN_URL")
              gh issue create --title "$title" --label external-api --label bug --body "$body"
            fi
          done
      # Only the failed call names, never contracts.xml: its tracebacks and captured logs
      # can hold API keys, and GitHub masks secrets in logs but not in artifacts.
      - if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: failures.txt
          retention-days: 7
