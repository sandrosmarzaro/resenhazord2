# RabbitMQ sizes a relative watermark from the host RAM, not the container's mem_limit:
# 0.4 of the 954 MB edge is 381 MiB, so flow control never beat the 400m OOM kill.
# 256 MiB is well above the ~165 MiB 7-day peak and leaves room for the overshoot seen
# when a burst of large replies trips the alarm (~285 MiB used, measured locally on 1 vCPU).
vm_memory_high_watermark.absolute = 256MiB
