<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 770" role="img" aria-label="Production architecture: the WhatsApp gateway and RabbitMQ run on an edge VPS, the Python core with the Discord, Telegram and LLM adapters runs on a core VPS, they talk over AMQP on a private network, and each node uses its own managed data stores and telemetry sinks.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.2; }
    .node { fill: none; stroke-width: 1.6; stroke-dasharray: 0; }
    .edge { stroke: #0969da; }
    .core { stroke: #8250df; }
    .edge-text { fill: #0969da; }
    .core-text { fill: #8250df; }
    .ext { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.2; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 13px; font-weight: 600; }
    .line { font-size: 12px; }
    .muted { font-size: 11px; fill: #59636e; }
    .label { font-size: 11px; fill: #59636e; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.4; }
    .scrape { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #151b23; stroke: #3d444d; }
      .ext { fill: #0d1117; stroke: #3d444d; }
      .edge { stroke: #4493f8; }
      .core { stroke: #ab7df8; }
      .edge-text { fill: #4493f8; }
      .core-text { fill: #ab7df8; }
      text { fill: #e6edf3; }
      .muted, .label { fill: #9198a1; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="770" rx="12"/>

  <!-- Outside world -->
  <rect class="ext" x="70" y="30" width="200" height="66" rx="8"/>
  <text class="title" x="170" y="58" text-anchor="middle">WhatsApp</text>
  <text class="muted" x="170" y="78" text-anchor="middle">groups and DMs</text>

  <rect class="ext" x="300" y="30" width="260" height="66" rx="8"/>
  <text class="title" x="430" y="52" text-anchor="middle">GitHub Actions</text>
  <text class="muted" x="430" y="70" text-anchor="middle">builds images to GHCR</text>
  <text class="muted" x="430" y="86" text-anchor="middle">SSH-deploys both nodes in parallel</text>

  <rect class="ext" x="720" y="30" width="140" height="66" rx="8"/>
  <text class="title" x="790" y="52" text-anchor="middle">Grafana Cloud</text>
  <text class="muted" x="790" y="70" text-anchor="middle">Prometheus · Loki</text>
  <text class="muted" x="790" y="86" text-anchor="middle">Tempo · alerts</text>

  <rect class="ext" x="880" y="30" width="110" height="66" rx="8"/>
  <text class="title" x="935" y="58" text-anchor="middle">Discord</text>
  <text class="muted" x="935" y="78" text-anchor="middle">slash commands</text>

  <rect class="ext" x="1005" y="30" width="110" height="66" rx="8"/>
  <text class="title" x="1060" y="58" text-anchor="middle">Telegram</text>
  <text class="muted" x="1060" y="78" text-anchor="middle">bot API</text>

  <rect class="ext" x="1130" y="30" width="110" height="66" rx="8"/>
  <text class="title" x="1185" y="52" text-anchor="middle">LLM providers</text>
  <text class="muted" x="1185" y="70" text-anchor="middle">Mistral → Groq</text>
  <text class="muted" x="1185" y="86" text-anchor="middle">→ Gemini</text>

  <!-- Nodes -->
  <rect class="node edge" x="40" y="120" width="540" height="360" rx="12"/>
  <text class="title edge-text" x="260" y="466">EDGE VPS</text>
  <text class="muted" x="330" y="466">resenhazord-edge</text>

  <rect class="node core" x="700" y="120" width="540" height="360" rx="12"/>
  <text class="title core-text" x="715" y="466">CORE VPS</text>
  <text class="muted" x="785" y="466">resenhazord-core</text>

  <!-- Edge services -->
  <rect class="box" x="70" y="165" width="180" height="120" rx="8"/>
  <text class="title" x="85" y="188">whatsapp gateway</text>
  <text class="line" x="85" y="210">Bun · Baileys</text>
  <text class="line" x="85" y="230">downloads media</text>
  <text class="line" x="85" y="250">metadata cache</text>
  <text class="muted" x="85" y="270">memory → Redis</text>

  <rect class="box" x="330" y="165" width="220" height="44" rx="8"/>
  <text class="title" x="345" y="192">node-exporter</text>
  <text class="muted" x="450" y="192">host metrics</text>

  <rect class="box" x="330" y="225" width="220" height="225" rx="8"/>
  <text class="title" x="345" y="250">RabbitMQ</text>
  <text class="muted" x="345" y="274">to core</text>
  <text class="line" x="345" y="292">commands · group_events</text>
  <text class="muted" x="345" y="318">to edge</text>
  <text class="line" x="345" y="336">replies · wa_actions · wa_rpc</text>
  <text class="muted" x="345" y="362">retry ladder</text>
  <text class="line" x="345" y="380">commands.retry → commands</text>
  <text class="line" x="345" y="398">commands.dlq when spent</text>
  <text class="muted" x="345" y="432">Prometheus plugin :15692</text>

  <!-- Core services -->
  <rect class="box" x="720" y="165" width="120" height="110" rx="8"/>
  <text class="title" x="735" y="188">Grafana Alloy</text>
  <text class="line" x="735" y="210">collector</text>
  <text class="line" x="735" y="230">spanmetrics</text>
  <text class="muted" x="735" y="252">host + edge scrapes</text>

  <rect class="box" x="880" y="165" width="340" height="285" rx="8"/>
  <text class="title" x="900" y="190">bot · Python core</text>
  <text class="line" x="900" y="214">FastAPI · CommandRegistry</text>
  <text class="line" x="900" y="236">~50 commands, one pipeline</text>
  <text class="line" x="900" y="258">broker consumers + WhatsApp client</text>
  <text class="line" x="900" y="280">Discord adapter · discord.py</text>
  <text class="line" x="900" y="302">Telegram adapter · python-telegram-bot</text>
  <text class="line" x="900" y="324">LLM agent · LangGraph + LangChain</text>
  <text class="muted" x="900" y="348">retries with backoff, DLQ on the last try</text>

  <!-- Platform links -->
  <line class="arrow" x1="170" y1="96" x2="170" y2="165" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="162" y="142" text-anchor="end">WebSocket</text>

  <line class="arrow" x1="935" y1="96" x2="935" y2="165" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="943" y="142">WebSocket</text>

  <line class="arrow" x1="1060" y1="96" x2="1060" y2="165" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="1068" y="142">polling</text>

  <line class="arrow" x1="1185" y1="165" x2="1185" y2="96" marker-end="url(#arrow)"/>
  <text class="label" x="1193" y="142">HTTPS</text>

  <!-- Gateway and broker -->
  <line class="arrow" x1="250" y1="245" x2="330" y2="245" marker-end="url(#arrow)"/>
  <text class="label" x="290" y="239" text-anchor="middle">publish</text>
  <line class="arrow" x1="330" y1="270" x2="250" y2="270" marker-end="url(#arrow)"/>
  <text class="label" x="290" y="286" text-anchor="middle">consume</text>

  <!-- Broker and core over the private network -->
  <line class="arrow" x1="550" y1="360" x2="880" y2="360" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="640" y="352" text-anchor="middle">AMQP :5672</text>
  <text class="label" x="640" y="376" text-anchor="middle">private VCN</text>

  <!-- Telemetry -->
  <polyline class="arrow scrape" points="550,187 640,187 640,245 720,245" marker-end="url(#arrow)"/>
  <line class="arrow scrape" x1="550" y1="245" x2="640" y2="245"/>
  <text class="label" x="595" y="179" text-anchor="middle">scrape :9100</text>
  <text class="label" x="595" y="236" text-anchor="middle">:15692</text>

  <line class="arrow" x1="880" y1="220" x2="840" y2="220" marker-end="url(#arrow)"/>
  <text class="label" x="860" y="212" text-anchor="middle">OTLP</text>

  <line class="arrow" x1="780" y1="165" x2="780" y2="96" marker-end="url(#arrow)"/>
  <text class="label" x="788" y="142">OTLP</text>

  <polyline class="arrow" points="230,165 230,112 740,112 740,96" marker-end="url(#arrow)"/>
  <text class="label" x="480" y="137" text-anchor="middle">OTLP direct, no collector on the edge</text>

  <!-- Data stores -->
  <rect class="ext" x="70" y="540" width="180" height="70" rx="8"/>
  <text class="title" x="160" y="570" text-anchor="middle">Upstash Redis</text>
  <text class="muted" x="160" y="590" text-anchor="middle">group metadata</text>

  <rect class="ext" x="290" y="540" width="310" height="70" rx="8"/>
  <text class="title" x="445" y="570" text-anchor="middle">MongoDB Atlas</text>
  <text class="muted" x="445" y="590" text-anchor="middle">WhatsApp session · mentions · counters</text>

  <rect class="ext" x="820" y="540" width="130" height="70" rx="8"/>
  <text class="title" x="885" y="570" text-anchor="middle">Neon Postgres</text>
  <text class="muted" x="885" y="590" text-anchor="middle">per-group config</text>

  <rect class="ext" x="965" y="540" width="130" height="70" rx="8"/>
  <text class="title" x="1030" y="570" text-anchor="middle">Redis Cloud</text>
  <text class="muted" x="1030" y="590" text-anchor="middle">agent checkpoints</text>

  <rect class="ext" x="1110" y="540" width="130" height="70" rx="8"/>
  <text class="title" x="1175" y="570" text-anchor="middle">Upstash Vector</text>
  <text class="muted" x="1175" y="590" text-anchor="middle">few-shot examples</text>

  <line class="arrow" x1="120" y1="285" x2="120" y2="540" marker-end="url(#arrow)"/>
  <text class="label" x="128" y="510">cache</text>

  <polyline class="arrow" points="210,285 210,505 420,505 420,540" marker-end="url(#arrow)"/>
  <text class="label" x="315" y="499" text-anchor="middle">session</text>

  <polyline class="arrow" points="880,420 570,420 570,540" marker-end="url(#arrow)"/>
  <text class="label" x="725" y="411" text-anchor="middle">mentions · counters</text>

  <line class="arrow" x1="930" y1="450" x2="930" y2="540" marker-end="url(#arrow)"/>
  <text class="label" x="936" y="510">config</text>

  <line class="arrow" x1="1030" y1="450" x2="1030" y2="540" marker-end="url(#arrow)"/>
  <text class="label" x="1036" y="510">checkpoints</text>

  <line class="arrow" x1="1175" y1="450" x2="1175" y2="540" marker-end="url(#arrow)"/>
  <text class="label" x="1181" y="510">retrieval</text>

  <!-- Errors and local dev -->
  <rect class="ext" x="70" y="660" width="260" height="70" rx="8"/>
  <text class="title" x="200" y="690" text-anchor="middle">Sentry</text>
  <text class="muted" x="200" y="710" text-anchor="middle">errors from the gateway and the bot</text>

  <rect class="ext" x="370" y="660" width="430" height="70" rx="8"/>
  <text class="title" x="585" y="684" text-anchor="middle">Local dev · docker compose</text>
  <text class="muted" x="585" y="702" text-anchor="middle">gateway, bot, RabbitMQ and a local Postgres on one machine</text>
  <text class="muted" x="585" y="718" text-anchor="middle">caches and agent checkpoints fall back to memory when unset</text>
</svg>
