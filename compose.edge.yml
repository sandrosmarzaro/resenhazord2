# Edge node (VM-A): gateway + broker. The gateway holds the stable Baileys session and
# RabbitMQ lives beside it so the broker survives bot redeploys on the core node.
# In production the core node's bot reaches RabbitMQ over the VCN private subnet
# (RABBITMQ_URL=amqps://<edge_private_ip>); locally, run both compose files together
# (docker compose -f compose.edge.yml -f compose.core.yml up) and they share the network.
services:
  whatsapp:
    container_name: whatsapp
    image: ghcr.io/sandrosmarzaro/resenhazord2:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    env_file: .env
    tty: true
    working_dir: /app
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - resenha-network
    restart: unless-stopped
    # Cap the gateway so a Baileys reconnect-storm or leak OOM-kills this container
    # (restart: unless-stopped then recovers) instead of starving the ~1 GB host into the
    # SSH-dead freeze. Pairs with the connection watchdog (mute-stall) and the host swap.
    mem_limit: 384m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pidof bun >/dev/null && test -f /home/nonroot/.whatsapp-connected"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13-management
    env_file: .env
    networks:
      - resenha-network
    restart: unless-stopped
    # AMQP + Prometheus metrics exposed for the core node on the private VCN IP only
    # (ADR 0002). Docker port publishing bypasses the host firewall, so binding all
    # interfaces left the Oracle security list as the only guard. The gateway reaches
    # the broker over resenha-network, not these ports. Management UI stays on localhost.
    ports:
      - "${EDGE_PRIVATE_IP:?set EDGE_PRIVATE_IP in .env (127.0.0.1 locally)}:5672:5672"
      - "${EDGE_PRIVATE_IP:?set EDGE_PRIVATE_IP in .env (127.0.0.1 locally)}:15692:15692"
      - "127.0.0.1:15672:15672"
    mem_limit: 400m
    # No RABBITMQ_VM_MEMORY_HIGH_WATERMARK env: rabbitmq:3.13 rejects that deprecated
    # variable and refuses to start. The default 0.4 relative watermark is also the
    # safer choice on this 1 GB node (blocks publishers before the host OOMs).
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Enable the bundled rabbitmq_prometheus plugin (exposes /metrics on 15692).
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Host RAM/CPU/swap for the core Alloy to scrape. No collector here (memory wall):
  # node-exporter only serves /metrics, measured at ~9 MiB, and the cap keeps it from
  # ever competing with Baileys on this ~1 GB host.
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.12.1-distroless
    command: --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - resenha-network
    restart: unless-stopped
    # Published on the private VCN IP only: Docker port publishing bypasses the host
    # firewall, so a security-list mistake must not expose host details to the internet.
    # The list then opens 9100 from VM-B.
    ports:
      - "${EDGE_PRIVATE_IP:?set EDGE_PRIVATE_IP in .env (127.0.0.1 locally)}:9100:9100"
    mem_limit: 32m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rabbitmq-data:

networks:
  resenha-network:
    driver: bridge
